<body class="project-page passion-project-page">
  <article class="page sans">

    <div class="page-body">
      <div class="passion-tags"><span class="selected-value select-value-color-pink">Art</span><span class="selected-value select-value-color-pink">Ballet</span><span class="selected-value select-value-color-orange">Guitar</span><span class="selected-value select-value-color-yellow">Music</span><span class="selected-value select-value-color-blue">Piano</span><span class="selected-value select-value-color-green">Singing</span><span class="selected-value select-value-color-gray">Violin</span><span class="selected-value select-value-color-green">Yoga</span></div>

      <section class="media-block">

  <script>
    (function () {
      var video = document.getElementById("passion-video");
      var wrap = document.getElementById("passion-video-wrap");
      if (!video || !wrap) return;
      video.addEventListener("error", function () { wrap.classList.add("is-error"); });
    })();
